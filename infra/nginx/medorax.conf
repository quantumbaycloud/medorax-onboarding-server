server {
    listen 80;
    server_name onboarding.medorax.in;

    location / {
        proxy_pass http://onboarding-web:80;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}


server {
    listen 80;
    server_name api.medorax.in;

    client_max_body_size 25M;

    # --------------------------------------------------------
    # MEDORAX COMMERCIAL LICENSING
    #
    # /licensing/v1/licenses is protected by issuer token.
    # ERP clients use the activation/validation endpoints.
    # --------------------------------------------------------

    location /licensing/ {
        rewrite ^/licensing/(.*)$ /$1 break;

        proxy_pass http://licensing-issuer:8100;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://onboarding-api:8000;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}