services:

  # ============================================================
  # POSTGRESQL
  # ============================================================

  postgres:
    image: postgres:17-alpine
    container_name: medorax-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - medorax_pgdata:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    networks:
      - medorax


  # ============================================================
  # REDIS
  # ============================================================

  redis:
    image: redis:8-alpine
    container_name: medorax-redis
    restart: unless-stopped

    command:
      [
        "redis-server",
        "--requirepass",
        "${REDIS_PASSWORD}",
        "--appendonly",
        "yes",
        "--appendfsync",
        "everysec"
      ]

    volumes:
      - medorax_redisdata:/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli",
          "-a",
          "${REDIS_PASSWORD}",
          "ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    networks:
      - medorax


  # ============================================================
  # COMMERCIAL MEDORAX LICENSE ISSUER
  # ============================================================

  licensing-issuer:
    build:
      context: ./licensing-issuer
      dockerfile: Dockerfile

    container_name: medorax-licensing-issuer
    restart: unless-stopped

    env_file:
      - ./licensing-issuer/.env

    volumes:
      - ./licensing-issuer/keys:/run/secrets/medorax-license:ro
      - medorax_licensing_data:/data

    expose:
      - "8100"

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - medorax


  # ============================================================
  # ONBOARDING API
  # ============================================================

  onboarding-api:
    build:
      context: ./services/onboarding-api
      dockerfile: Dockerfile

    container_name: medorax-onboarding-api
    restart: unless-stopped

    env_file:
      - ./services/onboarding-api/.env

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    expose:
      - "8000"

    volumes:
      - medorax_documents:/app/storage/documents

    networks:
      - medorax


  # ============================================================
  # ONBOARDING WEBSITE
  # ============================================================

  onboarding-web:
    build:
      context: ./apps/onboarding-web
      dockerfile: Dockerfile

      args:
        VITE_API_URL: https://api.medorax.in
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY}

    container_name: medorax-onboarding-web
    restart: unless-stopped

    expose:
      - "80"

    depends_on:
      - onboarding-api

    networks:
      - medorax


  # ============================================================
  # MAIN NGINX GATEWAY
  # ============================================================

  nginx:
    image: nginx:1.27-alpine
    container_name: medorax-nginx
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./infra/nginx/medorax.conf:/etc/nginx/conf.d/default.conf:ro

      - ./infra/nginx/certs:/etc/nginx/certs:ro

    depends_on:
      - onboarding-web
      - onboarding-api

    networks:
      - medorax


# ==============================================================
# VOLUMES
# ==============================================================

volumes:

  medorax_pgdata:
    name: medorax_pgdata

  medorax_redisdata:
    name: medorax_redisdata

  medorax_documents:
    name: medorax_documents


# ==============================================================
# NETWORK
# ==============================================================

networks:

  medorax:
    name: medorax
    driver: bridge